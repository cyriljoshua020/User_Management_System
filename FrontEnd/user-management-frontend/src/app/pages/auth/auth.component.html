<div class="auth-container">
    <div class="auth-card">
        <div class="auth-tabs">
            <button class="tab-btn" [class.active]="isLoginMode" (click)="switchMode(true)">
                Login
            </button>
            <button class="tab-btn" [class.active]="!isLoginMode" (click)="switchMode(false)">
                Sign Up
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form *ngIf="isLoginMode" [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()" class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" formControlName="username" />
                <div class="error"
                    *ngIf="loginForm.controls['username'].invalid && loginForm.controls['username'].touched">
                    Username is required
                </div>
            </div>

            <!-- LOGIN Password -->
            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input [type]="showLoginPassword ? 'text' : 'password'" formControlName="password" />
                    <button type="button" class="eye-btn" (click)="toggleLoginPassword()">
                        {{ showLoginPassword ? 'Hide' : 'Show' }}
                    </button>
                </div>

                <div class="error"
                    *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched">
                    Password is required
                </div>
            </div>

            <button class="btn primary" type="submit">Login</button>
        </form>

        <!-- SIGNUP FORM -->
        <form *ngIf="!isLoginMode" [formGroup]="signupForm" (ngSubmit)="onSignupSubmit()" class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" formControlName="username" />
                <div class="error"
                    *ngIf="signupForm.controls['username'].invalid && signupForm.controls['username'].touched">
                    Username is required
                </div>
            </div>

            <!-- SIGNUP Password -->
            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input [type]="showSignupPassword ? 'text' : 'password'" formControlName="password" />
                    <button type="button" class="eye-btn" (click)="toggleSignupPassword()">
                        {{ showSignupPassword ? 'Hide' : 'Show' }}
                    </button>
                </div>

                <div class="error"
                    *ngIf="signupForm.controls['password'].invalid && signupForm.controls['password'].touched">
                    Password must be at least 4 characters
                </div>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" formControlName="fullName" />
                <div class="error"
                    *ngIf="signupForm.controls['fullName'].invalid && signupForm.controls['fullName'].touched">
                    Full name is required
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" />
                <div class="error" *ngIf="signupForm.controls['email'].invalid && signupForm.controls['email'].touched">
                    Valid email is required
                </div>
            </div>

            <div class="form-group">
                <label>Admin Secret (optional for ADMIN signup)</label>
                <input type="text" formControlName="adminSecret" />
            </div>

            <button class="btn primary" type="submit">Sign Up</button>
        </form>
    </div>
</div>
